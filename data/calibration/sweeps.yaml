# Base calibration sweeps, per robot (four serial digits) and arm (URDF prefix): predefined, taken from the old
# monitor.
#
# - takes: each sweeps one joint (0: shoulder pan, 1: shoulder lift) from `from` to `to` in `steps` waypoints, radians;
#   the other joints stay at `joints` (UR driver order; the swept joint's entry is ignored). J1 takes keep J0 at 0.
#
# - validation: arm poses Validate cycles through at each base spot (radians). Alice's and Belle's are generated by
#   scripts/calibration_poses.py: spread evenly over the arm's reach, the tool's z outwards from the robot and up
#   (the markers face the cameras), clear of the robot with the marker grown by 25 mm and every joint nudged by 4°,
#   and plannable by the arm planner. Cindy's are six of the old pipeline's validation samples, spread over J0.
#
# The takes are the ones the old pipeline ran on each robot (session named per arm), duplicates dropped, in an order
# and directions that keep the moves between takes short from the stow pose (`short_moves` in
# plugins/calibration/robot/sweeps.py). Takes changed since, to clear the robot with the same margin, say how
# (`calibration_poses.py fix`). The file's order only numbers the takes: the plugin records them in the shortest order
# from where the arm stands, each turned by whole turns and run in the direction that starts nearest the arm.
# Some angles are a whole turn (6.283) off the recorded ones, which is the same pose.
