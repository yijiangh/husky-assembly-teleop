# Calibration Pipeline Configuration
# This file is shared across all calibration scripts (0-3)
# Place this file inside the date folder (e.g., 20250617/config.yaml)

# Data settings
data_batches:
  - "j0"
  - "j1"

# Validation data batch for 3_verify_calibration.py
# validation_data_batch: "j0"
# validation_data_batch: "j1"  
validation_data_batch: "validation"

# Robot settings
robot_name: "0806"  # Options: "0806" (dual arm), "0804" (single arm)
arm: "left"         # Options: "left", "right" (only used for dual arm robot)

# Export settings
export: true

# Visualization settings
use_gui: false

# Punch validation analysis settings for 4_punch_validation.py
# arm: validation arm to analyze for 4_punch_validation.py.
# This is independent from the main `arm` above, which selects the arm used to
# generate calibration data and compute the calibrated transformation.
punch_validation:
  arm: left
  # arm: null

# Punch tool calibration validation settings
# Translation-only offset from tool0 flange to punch tip (meters)
# Obtained via UR 4-point TCP calibration
# Left: mm -> m, [-0.15, -3.75, 118.72] -> [-0.00015, -0.00375, 0.11872]
# Right: mm -> m, [0.17, 3.63, 118.84] -> [0.00017, 0.00363, 0.11884]
punch_tool:
  left:
    offset_xyz: [-0.00015, -0.00375, 0.11872]
  right:
    offset_xyz: [0.00017, 0.00363, 0.11884]