[develop]
script_dir=$base/lib/husky_assembly_teleop
[install]
install_scripts=$base/lib/husky_assembly_teleop
[tool:pytest]
# * Quick by default (~10 s): slow tests and linters are skipped. Everything: pytest -m ""
# ! -p no:anyio: the venv's anyio plugin does not load with the system pytest.
addopts = -p no:anyio -m "not slow and not linter"
# Only our tests: data/ and external/ hold scripts and suites of their own.
testpaths = test
markers =
    slow: takes seconds: compas_fab scene comparison, planner searches
    linter: ament style checks (flake8, pep257, copyright)
    flake8: ament flake8 check
    pep257: ament pep257 check
    copyright: ament copyright check
