[develop]
script_dir=$base/lib/husky_assembly_teleop
[install]
install_scripts=$base/lib/husky_assembly_teleop
[tool:pytest]
# * Quick by default (~15 s): slow tests and linters are skipped. Before a lab session: pytest -m safety.
#   Everything, before every commit: pytest -m "". Tests mirror the package: test/<area>/ (AGENTS.md).
# ! -p no:anyio: the venv's anyio plugin does not load with the system pytest.
addopts = -p no:anyio -m "not slow and not linter"
# Only our tests: data/ and external/ hold scripts and suites of their own.
testpaths = test
markers =
    slow: takes seconds, or checks offline analysis: compas_fab comparisons, planner searches, experiments/
    safety: guards on commands to the real robots, frames and models they rely on, layers and linters
    linter: ament style checks (flake8, pep257, copyright)
    flake8: ament flake8 check
    pep257: ament pep257 check
    copyright: ament copyright check
