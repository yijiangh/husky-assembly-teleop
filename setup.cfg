[develop]
script_dir=$base/lib/husky_assembly_teleop
[install]
install_scripts=$base/lib/husky_assembly_teleop
[tool:pytest]
# * Quick by default, before every commit: everything but slow tests. Before a lab session: pytest -m safety.
#   One plugin's tests, slow ones too: pytest -m <plugin>. Everything, before merging into core-port: pytest -m "".
#   Tests mirror the package: test/<area>/ (AGENTS.md).
# * Tests run on 4 parallel workers (pytest-xdist): as fast as one per core, at half the CPU, leaving cores for the
#   monitor. `-n 0` runs one area faster, without starting workers.
# ! -p no:anyio: the venv's anyio plugin does not load with the system pytest.
addopts = -p no:anyio -m "not slow" -n 4
# A test still running after this many seconds fails with its traceback, instead of stalling the run.
timeout = 60
# Only our tests: data/ and external/ hold scripts and suites of their own.
testpaths = test
markers =
    slow: takes over a second, or checks offline analysis: compas_fab comparisons, planner searches, experiments/
    safety: guards on commands to the real robots, and the frames and models they rely on; no slow tests
    old_scripts: runs the old calibration scripts; only with --old-scripts, even under -m ""
    linter: ament style checks (flake8, pep257, copyright)
    flake8: ament flake8 check
    pep257: ament pep257 check
    copyright: ament copyright check
